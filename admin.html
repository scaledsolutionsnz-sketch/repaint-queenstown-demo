<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Repaint Queenstown</title>
<meta name="theme-color" content="#02abe7">
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#191919; --text:#232323; --muted:#5d666d;
  --paper:#ecf3f7; --line:rgba(25,25,25,.13); --white:#fff;
  --blue:#02abe7; --blue-deep:#0289ba;
  --r:4px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 16px;
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text);background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
.card{
  width:100%;max-width:400px;background:var(--white);border:1px solid var(--line);
  border-radius:6px;padding:34px 32px 28px;border-top:4px solid var(--blue);
  box-shadow:0 24px 60px -34px rgba(25,25,25,.55);
}
.logo{display:block;height:38px;width:auto;margin:0 0 18px}
.brand{
  font-family:'Outfit',-apple-system,'Segoe UI',sans-serif;
  font-weight:700;font-size:1.3rem;color:var(--ink);letter-spacing:-.02em;margin:0 0 2px;
}
.sub{font-size:.92rem;margin:0 0 24px;color:var(--muted)}
label{display:block;font-size:.74rem;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);margin:0 0 6px}
input{
  width:100%;border:1px solid rgba(25,25,25,.2);border-radius:var(--r);
  padding:12px 14px;font:400 1rem/1.4 inherit;color:var(--ink);background:var(--white);
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease);
}
input:focus{outline:0;border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(2,171,231,.18)}
.field{margin-bottom:16px}
button{
  width:100%;border:0;border-radius:var(--r);padding:15px 18px;cursor:pointer;min-height:52px;
  font:600 .98rem/1 'Outfit',-apple-system,sans-serif;background:var(--blue);color:var(--ink);
  transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);
}
button:hover{background:var(--blue-deep);color:var(--paper)}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.55;cursor:default;transform:none}
.msg{
  margin:16px 0 0;padding:11px 13px;border-radius:var(--r);font-size:.88rem;display:none;
}
.msg.err{display:block;background:#FDEEE8;color:#9A3412;border:1px solid #F1C9B5}
.msg.ok{display:block;background:#E3F5FC;color:#026287;border:1px solid #B6E3F5}
.foot{margin:22px 0 0;font-size:.8rem;color:var(--muted);text-align:center}
.foot a{color:var(--muted)}
.setup{
  margin:18px 0 0;padding:13px 15px;border-radius:var(--r);background:#FDEEE8;
  border:1px solid #F1C9B5;color:#9A3412;font-size:.85rem;line-height:1.55;display:none;
}
.setup code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
</style>
</head>
<body>

<main class="card">
  <img class="logo" src="img/logo.png" alt="Repaint Queenstown" width="1200" height="472">
  <h1 class="brand">Website editor</h1>
  <p class="sub">Sign in to edit the Repaint Queenstown website.</p>

  <form id="form" autocomplete="on">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="go">Sign in</button>
  </form>

  <p class="msg" id="msg" role="status"></p>
  <div class="setup" id="setup">
    <strong>Not configured yet.</strong> Put the Supabase publishable key in
    <code>assets/cms-config.js</code>, then run <code>supabase/schema.sql</code>
    in the Supabase SQL editor.
  </div>

  <p class="foot"><a href="index.html">← Back to the website</a></p>
</main>

<script src="assets/cms-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var CFG = window.CMS_CONFIG || {};
  var form = document.getElementById('form');
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + kind;
  }

  if (!CFG.url || !CFG.anonKey || /PASTE_/.test(CFG.anonKey)) {
    document.getElementById('setup').style.display = 'block';
    go.disabled = true;
    return;
  }
  if (!window.supabase || !window.supabase.createClient) {
    show('Could not load the sign-in library. Check your connection and reload.', 'err');
    go.disabled = true;
    return;
  }

  var sb = window.supabase.createClient(CFG.url, CFG.anonKey);

  function nextUrl() {
    var q = new URLSearchParams(location.search).get('next');
    if (q && /^[a-z0-9._-]+\.html/i.test(q.replace(/^\//, ''))) return q;
    return 'index.html?cms=edit';
  }

  // Already signed in? Go straight through.
  sb.auth.getSession().then(function (res) {
    if (res.data && res.data.session) location.replace(nextUrl());
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    go.disabled = true;
    go.textContent = 'Signing in…';
    sb.auth.signInWithPassword({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    }).then(function (res) {
      if (res.error) throw res.error;
      show('Signed in. Opening the editor…', 'ok');
      location.replace(nextUrl());
    }).catch(function (err) {
      show(err.message || 'Could not sign in.', 'err');
      go.disabled = false;
      go.textContent = 'Sign in';
    });
  });
})();
</script>
</body>
</html>
